[versions]
mod-version = "0.1.0"

# Fabric
jdk = "21"
minecraft = "1.21.11"
yarn_mappings = "1.21.11+build.1"
fabric-loader = "0.19.5"

# Loom (1.14 is compatible with the new Gradle version)
loom = "1.14"

# Meteor
meteor = "1.21.11-SNAPSHOT"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn_mappings = { module = "net.fabricmc:yarn", version.ref = "yarn_mappings" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

[plugins]
# Use the legacy ID but with the new Loom version
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
