[versions]
mod-version = "0.1.0"

# Fabric
jdk = "21"
minecraft = "1.21.11"
mappings = "1.21.11+build.1"
fabric-loader = "0.19.5"

# Loom
loom = "1.14-SNAPSHOT"

# Meteor
meteor = "1.21.11-SNAPSHOT"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
mappings = { module = "net.minecraft:joined", version.ref = "mappings" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
